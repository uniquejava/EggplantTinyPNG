<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EggplantTinyPNG — UI styles</title>
<style>
  :root {
    --pick: #0a84ff;
    --desk-a: #8fa3b5;
    --desk-b: #5c6d7e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    color: #1a1a1a;
    background:
      radial-gradient(1200px 600px at 50% -10%, #9aafc0 0%, transparent 55%),
      linear-gradient(180deg, #7d8f9f, #556574);
    min-height: 100vh;
    padding: 28px 24px 64px;
  }
  h1 {
    margin: 0 0 6px;
    font-size: 20px;
    font-weight: 650;
    letter-spacing: -0.02em;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.25);
  }
  .intro {
    color: rgba(255,255,255,.78);
    max-width: 780px;
    margin-bottom: 22px;
  }
  .intro strong { color: #fff; font-weight: 600; }
  .grid {
    display: grid;
    gap: 28px;
    grid-template-columns: 1fr;
    max-width: 920px;
  }
  .card {
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 14px;
    padding: 16px 16px 20px;
    backdrop-filter: blur(8px);
    cursor: pointer;
  }
  .card-head {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 14px;
  }
  .card-head input {
    margin-top: 3px;
    width: 16px;
    height: 16px;
    accent-color: var(--pick);
  }
  .card-meta { flex: 1; }
  .card-meta h2 {
    margin: 0 0 2px;
    font-size: 14px;
    font-weight: 650;
    color: #fff;
  }
  .card-meta p {
    margin: 0;
    font-size: 12px;
    color: rgba(255,255,255,.72);
  }
  .badge {
    font-size: 10px;
    font-weight: 650;
    letter-spacing: .04em;
    text-transform: uppercase;
    padding: 3px 7px;
    border-radius: 999px;
    background: rgba(0,0,0,.28);
    color: rgba(255,255,255,.85);
    white-space: nowrap;
  }
  .badge.rec { background: rgba(10,132,255,.55); }
  .stage {
    display: flex;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
    padding: 18px 10px 14px;
    background:
      linear-gradient(180deg, transparent, rgba(0,0,0,.12)),
      repeating-linear-gradient(-12deg, transparent 0 10px, rgba(255,255,255,.03) 10px 11px);
    border-radius: 10px;
    border: 1px dashed rgba(255,255,255,.2);
    overflow: auto;
  }
  .stage-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .stage-label {
    font-size: 10px;
    font-weight: 650;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: rgba(255,255,255,.55);
  }
  .dims {
    margin-top: 10px;
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,.55);
    font-variant-numeric: tabular-nums;
  }

  /* ===== Shared window chrome ===== */
  .win {
    width: 520px;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 18px 48px rgba(0,0,0,.38);
    font-size: 12px;
    user-select: none;
    background: #f5f5f7;
    color: #1d1d1f;
  }
  .win.narrow { width: 420px; }
  .win.wide { width: 640px; }
  .tb {
    height: 40px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 14px;
    position: relative;
    background: #ececef;
    border-bottom: 1px solid rgba(0,0,0,.06);
  }
  .dots { display: flex; gap: 7px; flex: 0 0 auto; }
  .dots i {
    width: 12px; height: 12px; border-radius: 50%; display: block;
  }
  .dots .r { background: #ff5f57; }
  .dots .y { background: #febc2e; }
  .dots .g { background: #28c840; }
  .tb .title {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-weight: 560;
    font-size: 13px;
    letter-spacing: -0.01em;
    color: #3a3a3c;
    white-space: nowrap;
  }
  .tb .act {
    margin-left: auto;
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .tb .ghost-btn {
    font-size: 11px;
    font-weight: 560;
    color: #0a84ff;
    padding: 4px 8px;
    border-radius: 6px;
  }
  .tb .auto-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 560;
    color: #3a3a3c;
    margin-right: 4px;
  }
  .tb .auto-toggle .sw {
    width: 28px; height: 16px;
    border-radius: 999px;
    background: #34c759;
    position: relative;
    flex: 0 0 auto;
  }
  .tb .auto-toggle .sw::after {
    content: "";
    position: absolute;
    top: 2px; right: 2px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,.2);
  }
  .tb .auto-toggle .sw.off { background: #d1d1d6; }
  .tb .auto-toggle .sw.off::after { right: auto; left: 2px; }
  .body { padding: 16px; }
  .auto-hint {
    margin-top: 10px;
    font-size: 11px;
    color: #86868b;
    text-align: center;
  }
  .auto-hint code {
    font: 500 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #ececef;
    padding: 1px 5px;
    border-radius: 4px;
    color: #3a3a3c;
  }

  /* Shared atoms */
  .drop {
    border: 1.5px dashed #c5c5c7;
    border-radius: 12px;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-align: center;
    color: #6e6e73;
  }
  .drop.active {
    border-color: #0a84ff;
    background: #f0f6ff;
    color: #0a84ff;
  }
  .drop .ico {
    width: 44px; height: 44px;
    border-radius: 12px;
    display: grid; place-items: center;
    background: #f2f2f7;
    font-size: 22px;
  }
  .drop.active .ico { background: #dbeafe; }
  .drop h3 {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    color: #1d1d1f;
  }
  .drop.active h3 { color: #0a84ff; }
  .drop p { margin: 0; font-size: 12px; }
  .drop .hint { font-size: 11px; opacity: .7; }

  .bar {
    height: 6px;
    border-radius: 999px;
    background: #e5e5ea;
    overflow: hidden;
  }
  .bar > i {
    display: block;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, #0a84ff, #64d2ff);
  }
  .save {
    font-weight: 650;
    color: #248a3d;
    font-variant-numeric: tabular-nums;
  }
  .muted { color: #86868b; }
  .mono { font-variant-numeric: tabular-nums; }

  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: #fff;
    border-radius: 10px;
    border: 1px solid rgba(0,0,0,.06);
  }
  .thumb {
    width: 36px; height: 36px;
    border-radius: 8px;
    background:
      linear-gradient(135deg, #a8d5ff, #7eb8f0 40%, #f5c6a0 70%, #e8a87c);
    flex: 0 0 auto;
    position: relative;
    overflow: hidden;
  }
  .thumb.png {
    background:
      linear-gradient(135deg, #c8e6c9, #81c784 45%, #fff59d);
  }
  .thumb.jpg {
    background:
      linear-gradient(135deg, #ffccbc, #ff8a65 50%, #ce93d8);
  }
  .thumb::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(45deg, rgba(255,255,255,.15) 25%, transparent 25%),
      linear-gradient(-45deg, rgba(255,255,255,.1) 25%, transparent 25%);
    background-size: 8px 8px;
  }
  .meta { flex: 1; min-width: 0; }
  .meta .name {
    font-weight: 560;
    font-size: 12.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .meta .sub { font-size: 11px; color: #86868b; margin-top: 2px; }
  .pill {
    font-size: 10px;
    font-weight: 650;
    padding: 2px 7px;
    border-radius: 999px;
    background: #e8f8ec;
    color: #248a3d;
  }
  .pill.busy { background: #e8f1ff; color: #0a84ff; }
  .pill.wait { background: #f2f2f7; color: #6e6e73; }
  .btn {
    appearance: none; border: 0;
    border-radius: 8px;
    padding: 8px 14px;
    font: 600 12px/1 -apple-system, sans-serif;
    background: #0a84ff;
    color: #fff;
    cursor: default;
  }
  .btn.ghost {
    background: #e8e8ed;
    color: #1d1d1f;
  }
  .btn.sm { padding: 5px 10px; font-size: 11px; }

  /* ===== A: Drop Zone Hero ===== */
  .a-empty .drop { height: 220px; margin-bottom: 0; }
  .a-busy .drop { height: 120px; margin-bottom: 12px; }
  .a-busy .queue { display: flex; flex-direction: column; gap: 8px; }
  .a-busy .progress-card {
    background: #fff;
    border: 1px solid rgba(0,0,0,.06);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .a-busy .progress-card .top {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 12px;
  }
  .a-done .summary {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 12px;
    padding: 0 2px;
  }
  .a-done .summary .big {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: #248a3d;
  }
  .a-done .queue { display: flex; flex-direction: column; gap: 8px; }
  .a-done .actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    justify-content: flex-end;
  }

  /* ===== B: Split Inspector ===== */
  .b-split {
    display: grid;
    grid-template-columns: 1fr 200px;
    min-height: 300px;
  }
  .b-main {
    padding: 14px;
    background: #f5f5f7;
    border-right: 1px solid rgba(0,0,0,.06);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .b-main .drop { flex: 1; min-height: 140px; }
  .b-rail {
    padding: 14px;
    background: #fff;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .b-rail h4 {
    margin: 0;
    font-size: 11px;
    font-weight: 650;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: #86868b;
  }
  .b-stack { display: flex; flex-direction: column; gap: 4px; }
  .b-stack .lab { font-size: 11px; color: #6e6e73; }
  .b-dd {
    background: #f2f2f7;
    border-radius: 7px;
    padding: 7px 10px;
    font-size: 12px;
    font-weight: 560;
    display: flex;
    justify-content: space-between;
  }
  .b-dd::after { content: "▾"; color: #86868b; font-size: 10px; }
  .b-seg {
    display: flex;
    background: #f2f2f7;
    border-radius: 7px;
    padding: 2px;
  }
  .b-seg span {
    flex: 1;
    text-align: center;
    padding: 5px 0;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 560;
    color: #6e6e73;
  }
  .b-seg .on {
    background: #fff;
    color: #1d1d1f;
    box-shadow: 0 1px 2px rgba(0,0,0,.08);
  }
  .b-grow { flex: 1; }
  .b-est {
    font-size: 11px;
    color: #86868b;
    text-align: left;
  }

  /* ===== C: Compact Queue ===== */
  .c-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .c-toolbar .drop-mini {
    flex: 1;
    border: 1.5px dashed #c5c5c7;
    border-radius: 8px;
    background: #fff;
    padding: 8px 12px;
    font-size: 12px;
    color: #6e6e73;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .c-toolbar .drop-mini .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #0a84ff; opacity: .5;
  }
  .c-list { display: flex; flex-direction: column; gap: 6px; }
  .c-row {
    display: grid;
    grid-template-columns: 32px 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 8px 10px;
    background: #fff;
    border-radius: 8px;
    border: 1px solid rgba(0,0,0,.05);
  }
  .c-row .thumb { width: 32px; height: 32px; border-radius: 6px; }
  .c-row .meta .name { font-size: 12px; }
  .c-row .right {
    text-align: right;
    font-size: 11px;
    min-width: 88px;
  }
  .c-row .bar { margin-top: 4px; height: 4px; }
  .c-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid rgba(0,0,0,.06);
    font-size: 11px;
    color: #6e6e73;
  }

  /* ===== D: Soft Results ===== */
  .d-win { background: #f7f4ef; }
  .d-win .tb { background: #efeae3; border-bottom-color: rgba(0,0,0,.05); }
  .d-hero {
    text-align: center;
    padding: 8px 8px 16px;
  }
  .d-hero .ring {
    width: 72px; height: 72px;
    margin: 0 auto 10px;
    border-radius: 50%;
    background:
      conic-gradient(#3d8b6e 0 252deg, #e5dfd4 252deg);
    display: grid; place-items: center;
  }
  .d-hero .ring > span {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: #f7f4ef;
    display: grid; place-items: center;
    font-size: 16px;
    font-weight: 700;
    color: #3d8b6e;
  }
  .d-hero h3 {
    margin: 0 0 4px;
    font-size: 16px;
    font-weight: 650;
    letter-spacing: -0.02em;
  }
  .d-hero p { margin: 0; color: #7a746a; font-size: 12px; }
  .d-cards { display: flex; flex-direction: column; gap: 8px; }
  .d-card {
    background: #fff;
    border-radius: 12px;
    padding: 12px;
    display: flex;
    gap: 12px;
    align-items: center;
    box-shadow: 0 1px 2px rgba(60,50,30,.06);
  }
  .d-card .sizes {
    margin-left: auto;
    text-align: right;
  }
  .d-card .sizes .from { font-size: 11px; color: #9a9286; text-decoration: line-through; }
  .d-card .sizes .to { font-size: 14px; font-weight: 650; color: #1d1d1f; }
  .d-accent { color: #3d8b6e; }

  /* ===== E: Minimal Sheet ===== */
  .e-win { background: #fff; }
  .e-win .tb {
    background: transparent;
    border-bottom: 0;
  }
  .e-body {
    padding: 8px 24px 28px;
    text-align: center;
  }
  .e-logo {
    width: 56px; height: 56px;
    margin: 8px auto 14px;
    border-radius: 14px;
    background: linear-gradient(145deg, #e8f4ff, #d4e9ff);
    display: grid; place-items: center;
    font-size: 26px;
  }
  .e-body h3 {
    margin: 0 0 6px;
    font-size: 18px;
    font-weight: 650;
    letter-spacing: -0.03em;
  }
  .e-body .lead {
    margin: 0 0 20px;
    color: #86868b;
    font-size: 13px;
  }
  .e-drop {
    border: 1.5px dashed #d2d2d7;
    border-radius: 16px;
    padding: 36px 20px;
    background: #fafafa;
    color: #6e6e73;
  }
  .e-drop strong { color: #0a84ff; font-weight: 600; }
  .e-busy-body { padding: 24px 28px 32px; }
  .e-busy-body .status {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    font-size: 13px;
  }
  .e-busy-body .bar { height: 8px; margin-bottom: 8px; }
  .e-busy-body .files {
    margin-top: 18px;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .e-file {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    padding: 6px 0;
    border-bottom: 1px solid #f2f2f7;
    color: #6e6e73;
  }
  .e-file .ok { color: #248a3d; font-weight: 560; }

  /* ===== F: Finder-ish dual pane ===== */
  .f-split {
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 280px;
  }
  .f-pane {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .f-pane:first-child {
    border-right: 1px solid rgba(0,0,0,.06);
    background: #fafafa;
  }
  .f-pane h4 {
    margin: 0;
    font-size: 11px;
    font-weight: 650;
    color: #86868b;
    letter-spacing: .04em;
    text-transform: uppercase;
    padding: 0 4px;
  }
  .f-pane .drop { flex: 1; min-height: 160px; }
  .f-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px;
    background: #fff;
    border-radius: 8px;
    border: 1px solid rgba(0,0,0,.05);
  }
  .f-item .arrow {
    color: #0a84ff;
    font-size: 14px;
    font-weight: 700;
  }
  .f-bottom {
    grid-column: 1 / -1;
    padding: 10px 14px;
    background: #ececef;
    border-top: 1px solid rgba(0,0,0,.06);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .footer {
    position: sticky;
    bottom: 0;
    margin: 28px -24px -64px;
    padding: 14px 24px 20px;
    background: linear-gradient(180deg, transparent, rgba(20,28,36,.92) 28%);
    display: flex;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
  }
  .footer .pick { color: #fff; font-size: 13px; }
  .footer .pick span { font-weight: 700; color: #7ec8ff; }
  .footer button {
    appearance: none; border: 0; border-radius: 8px;
    padding: 8px 14px;
    font: 600 13px/1 -apple-system, sans-serif;
    background: #0a84ff; color: #fff; cursor: pointer;
  }
</style>
</head>
<body>
  <h1>EggplantTinyPNG — 主窗口样式候选</h1>
  <p class="intro">
    产品形态对齐 TinyPNG：<strong>拖图进窗口 → 压缩 → 看节省比例 → 导出</strong>。
    技术栈跟 Shot / Fred 一样：原生 SwiftUI + AppKit，macOS 15+。
    下面全是<strong>浅色</strong>方案；每张卡标了空态 / 压缩中 / 完成里最关键的一两态。
    点选后告诉我代号，再落到 Xcode 项目。
  </p>

  <div class="grid">

    <!-- A -->
    <label class="card">
      <div class="card-head">
        <input type="radio" name="style" value="A" checked />
        <div class="card-meta">
          <h2>A · Drop Zone 英雄区（选定）</h2>
          <p>大拖拽区 + 队列 + 总进度。工具栏「自动导出」开关：开则拖入即压缩并写到原图旁（<code style="color:#9ec9ff">name-tiny.ext</code>，撞名再拼时间戳）。</p>
        </div>
        <span class="badge rec">选定</span>
      </div>
      <div class="stage">
        <div class="stage-col">
          <span class="stage-label">空态</span>
          <div class="win a-empty">
            <div class="tb">
              <div class="dots"><i class="r"></i><i class="y"></i><i class="g"></i></div>
              <div class="title">EggplantTinyPNG</div>
              <div class="act"><span class="ghost-btn">打开…</span></div>
            </div>
            <div class="body">
              <div class="drop active">
                <div class="ico">⬇</div>
                <h3>拖放图片到此处</h3>
                <p>PNG · JPEG · WebP</p>
                <span class="hint">或点击选择文件</span>
              </div>
            </div>
          </div>
        </div>
        <div class="stage-col">
          <span class="stage-label">压缩中 → 完成</span>
          <div class="win a-busy a-done">
            <div class="tb">
              <div class="dots"><i class="r"></i><i class="y"></i><i class="g"></i></div>
              <div class="title">EggplantTinyPNG</div>
              <div class="act"><span class="ghost-btn">打开…</span></div>
            </div>
            <div class="body">
              <div class="drop" style="height:72px;flex-direction:row;gap:12px;padding:0 16px">
                <div class="ico" style="width:32px;height:32px;font-size:16px;border-radius:8px">⬇</div>
                <div style="text-align:left">
                  <h3 style="font-size:13px">继续添加图片</h3>
                  <p style="font-size:11px">拖放到此处或点「打开」</p>
                </div>

<script>
const picked = document.getElementById("picked");
document.querySelectorAll('input[name="style"]').forEach((r) => {
  r.addEventListener("change", () => { picked.textContent = r.value; });
});

document.getElementById("copy").addEventListener("click", async () => {
  const v = document.querySelector('input[name="style"]:checked')?.value || "A";
  const map = {
    A: "A Drop Zone 英雄区：大拖拽区 → 顶栏续传 + 总进度卡 + 文件队列（推荐）",
    B: "B 左右分栏检查器：左队列右质量/格式/输出",
    C: "C 紧凑工具队列：迷你投放条 + 行内进度，小窗",
    D: "D 软结果页：圆环总节省 + 卡片列表（完成态导向）",
    E: "E 极简单页：空态单投放面，压缩时大进度条",
    F: "F 前后对照双栏：Original | Compressed + 底栏总进度",
  };
  const text = `选 EggplantTinyPNG UI：${map[v]}。浅色。拖放压缩 + 耗时进度条。技术栈同 Shot/Fred（SwiftUI，macOS 15+）。`;
  try {
    await navigator.clipboard.writeText(text);
    const btn = document.getElementById("copy");
    btn.textContent = "已复制";
    setTimeout(() => { btn.textContent = "复制选择说明"; }, 1200);
  } catch {
    prompt("复制这段发给我：", text);
  }
});
</script>
