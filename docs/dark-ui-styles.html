<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EggplantTinyPNG — Dark themes</title>
<style>
  :root { --pick: #5ac8fa; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    color: #1a1a1a;
    background:
      radial-gradient(1100px 520px at 50% -8%, #c5b8a8 0%, transparent 55%),
      linear-gradient(180deg, #8a8076, #5c5550);
    min-height: 100vh;
    padding: 28px 24px 72px;
  }
  h1 {
    margin: 0 0 6px;
    font-size: 20px;
    font-weight: 650;
    letter-spacing: -0.02em;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.25);
  }
  .intro {
    color: rgba(255,255,255,.78);
    max-width: 820px;
    margin-bottom: 22px;
  }
  .intro strong { color: #fff; font-weight: 600; }
  .grid { display: grid; gap: 28px; max-width: 940px; }
  .card {
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 14px;
    padding: 16px 16px 18px;
    backdrop-filter: blur(8px);
    cursor: pointer;
  }
  .card-head {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 14px;
  }
  .card-head input {
    margin-top: 3px;
    width: 16px; height: 16px;
    accent-color: var(--pick);
  }
  .card-meta { flex: 1; }
  .card-meta h2 {
    margin: 0 0 2px;
    font-size: 14px;
    font-weight: 650;
    color: #fff;
  }
  .card-meta p {
    margin: 0;
    font-size: 12px;
    color: rgba(255,255,255,.7);
  }
  .badge {
    font-size: 10px;
    font-weight: 650;
    letter-spacing: .04em;
    text-transform: uppercase;
    padding: 3px 7px;
    border-radius: 999px;
    background: rgba(0,0,0,.3);
    color: rgba(255,255,255,.85);
    white-space: nowrap;
  }
  .badge.rec { background: rgba(90,200,250,.45); color: #fff; }
  .stage {
    display: flex;
    justify-content: center;
    gap: 18px;
    flex-wrap: wrap;
    padding: 20px 12px 16px;
    background:
      linear-gradient(180deg, transparent, rgba(0,0,0,.14)),
      repeating-linear-gradient(-12deg, transparent 0 10px, rgba(255,255,255,.03) 10px 11px);
    border-radius: 10px;
    border: 1px dashed rgba(255,255,255,.18);
  }
  .stage-col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .stage-label {
    font-size: 10px;
    font-weight: 650;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: rgba(255,255,255,.5);
  }
  .dims {
    margin-top: 10px;
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,.52);
  }

  /* ===== Shared window chrome (unified title + body) ===== */
  .win {
    width: 500px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(255,255,255,.06),
      0 22px 56px rgba(0,0,0,.45);
    font-size: 12px;
    user-select: none;
    color: #e8e8ed;
  }
  .tb {
    height: 44px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    position: relative;
    /* same fill as body — no separate gray bar */
  }
  .dots { display: flex; gap: 7px; flex: 0 0 auto; z-index: 1; }
  .dots i {
    width: 12px; height: 12px; border-radius: 50%; display: block;
  }
  .dots .r { background: #ff5f57; }
  .dots .y { background: #febc2e; }
  .dots .g { background: #28c840; }
  .tb .title {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-weight: 560;
    font-size: 12px;
    letter-spacing: -0.01em;
    opacity: .55;
    white-space: nowrap;
  }
  .tb .act {
    margin-left: auto;
    display: flex;
    gap: 10px;
    align-items: center;
    z-index: 1;
  }
  .ghost {
    font-size: 11px;
    font-weight: 560;
    opacity: .75;
    padding: 4px 2px;
  }
  .ghost:hover { opacity: 1; }

  /* Custom toggle — not system Switch */
  .tog {
    display: flex;
    align-items: center;
    gap: 0;
    height: 26px;
    padding: 2px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .tog span {
    padding: 0 9px;
    height: 22px;
    line-height: 22px;
    border-radius: 6px;
    opacity: .55;
  }
  .tog span.on {
    opacity: 1;
  }

  .body { padding: 14px 16px 16px; }
  .hint {
    margin-top: 8px;
    text-align: center;
    font-size: 11px;
    opacity: .45;
  }

  .drop {
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-align: center;
    position: relative;
    overflow: hidden;
    /* 统一虚线框（各主题只改颜色） */
    border-style: dashed;
    border-width: 1.5px;
  }
  .drop.hero { min-height: 168px; }
  .drop.compact {
    min-height: 56px;
    flex-direction: row;
    gap: 12px;
    padding: 0 14px;
    text-align: left;
  }
  .drop .ico {
    width: 40px; height: 40px;
    border-radius: 11px;
    display: grid; place-items: center;
    font-size: 18px;
    font-weight: 500;
  }
  .drop.compact .ico { width: 28px; height: 28px; font-size: 13px; border-radius: 8px; }
  .drop h3 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -0.02em; }
  .drop.compact h3 { font-size: 12.5px; }
  .drop p { margin: 0; font-size: 12px; opacity: .65; }
  .drop .micro { font-size: 11px; opacity: .45; }

  .bar {
    height: 4px;
    border-radius: 999px;
    overflow: hidden;
  }
  .bar > i { display: block; height: 100%; border-radius: inherit; }

  .prog {
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 10px;
  }
  .prog .top {
    display: flex;
    justify-content: space-between;
    margin-bottom: 7px;
    font-size: 11.5px;
  }

  .sum {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin: 12px 2px 8px;
  }
  .sum .lab { font-size: 11px; opacity: .45; margin-bottom: 2px; }
  .sum .big {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.03em;
  }
  .sum .n { font-size: 11px; opacity: .45; font-variant-numeric: tabular-nums; }

  .queue { display: flex; flex-direction: column; gap: 6px; }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 10px;
  }
  .thumb {
    width: 34px; height: 34px;
    border-radius: 7px;
    flex: 0 0 auto;
    background: linear-gradient(135deg, #6a8, #48a 40%, #c86);
  }
  .thumb.b { background: linear-gradient(135deg, #8ab, #5a8 50%, #a75); }
  .meta { flex: 1; min-width: 0; }
  .meta .name {
    font-weight: 560;
    font-size: 12.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .meta .sub { font-size: 10.5px; opacity: .5; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .pill {
    font-size: 10px;
    font-weight: 650;
    padding: 2px 7px;
    border-radius: 999px;
  }
  .reveal {
    width: 18px; height: 18px;
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: 10px;
    opacity: .55;
  }
  .actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 12px;
  }
  .btn {
    appearance: none; border: 0;
    border-radius: 8px;
    padding: 6px 12px;
    font: 600 11px/1 -apple-system, sans-serif;
  }

  /* 全部用「中灰深色」——避免 #0x / #12 纯黑
     投放区统一虚线框 */

  /* ========== D1 Soft Charcoal ========== */
  .d1 { background: #2c2c2e; }
  .d1 .tb { background: #2c2c2e; border-bottom: 1px solid rgba(255,255,255,.06); }
  .d1 .body { background: #2c2c2e; }
  .d1 .tog { background: rgba(255,255,255,.08); }
  .d1 .tog span.on { background: #3a3a3c; color: #f2f2f7; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .d1 .ghost { color: #aeaeb2; }
  .d1 .drop {
    background:
      radial-gradient(80% 80% at 50% 0%, rgba(100,210,255,.1), transparent 60%),
      #363638;
    border-color: rgba(100,210,255,.45);
  }
  .d1 .drop .ico { background: rgba(100,210,255,.14); color: #64d2ff; }
  .d1 .drop h3 { color: #f5f5f7; }
  .d1 .drop p { color: #aeaeb2; }
  .d1 .prog { background: #363638; border: 1px solid rgba(255,255,255,.06); }
  .d1 .bar { background: rgba(255,255,255,.1); }
  .d1 .bar > i { background: linear-gradient(90deg, #5ac8fa, #64d2ff); width: 67%; }
  .d1 .sum .big { color: #30d158; }
  .d1 .row { background: #363638; border: 1px solid rgba(255,255,255,.06); }
  .d1 .pill { background: rgba(48,209,88,.15); color: #30d158; }
  .d1 .pill.busy { background: rgba(100,210,255,.14); color: #64d2ff; }
  .d1 .reveal { background: rgba(255,255,255,.1); color: #aeaeb2; }
  .d1 .btn { background: rgba(255,255,255,.1); color: #e5e5ea; }
  .d1 .btn.pri { background: #0a84ff; color: #fff; }

  /* ========== D2 Warm Slate ========== */
  .d2 { background: #2e2c2a; }
  .d2 .tb { background: #2e2c2a; border-bottom: 1px solid rgba(232,200,150,.1); }
  .d2 .body { background: #2e2c2a; }
  .d2 .title { color: rgba(232,200,150,.6) !important; opacity: 1 !important; }
  .d2 .tog { background: rgba(232,200,150,.1); border: 1px solid rgba(232,200,150,.14); }
  .d2 .tog span { color: rgba(232,200,150,.5); }
  .d2 .tog span.on {
    background: #3f3b36;
    color: #e8c896;
    box-shadow: 0 1px 2px rgba(0,0,0,.25);
  }
  .d2 .ghost { color: rgba(232,200,150,.65); }
  .d2 .drop {
    background: #3a3733;
    border-color: rgba(232,200,150,.42);
  }
  .d2 .drop .ico {
    background: rgba(232,200,150,.12);
    color: #e8c896;
  }
  .d2 .drop h3 { color: #f3ece2; }
  .d2 .drop p { color: rgba(232,200,150,.55); }
  .d2 .prog { background: #3a3733; border: 1px solid rgba(232,200,150,.1); }
  .d2 .bar { background: rgba(255,255,255,.08); }
  .d2 .bar > i { background: linear-gradient(90deg, #c4a574, #e8c896); width: 67%; }
  .d2 .sum .big { color: #e8c896; }
  .d2 .row { background: #3a3733; border: 1px solid rgba(232,200,150,.1); }
  .d2 .pill { background: rgba(232,200,150,.14); color: #e8c896; }
  .d2 .pill.busy { background: rgba(232,200,150,.1); color: #c4a574; }
  .d2 .reveal { background: rgba(232,200,150,.12); color: #c4a574; }
  .d2 .btn { background: rgba(232,200,150,.1); color: #e8c896; border: 1px solid rgba(232,200,150,.15); }
  .d2 .btn.pri { background: #e8c896; color: #2a261f; border: 0; }

  /* ========== D3 Graphite Soft ========== */
  .d3 { background: #323234; }
  .d3 .tb { background: #323234; border-bottom: 1px solid rgba(255,255,255,.06); }
  .d3 .body { background: #323234; }
  .d3 .tog {
    background: #28282a;
    border-radius: 999px;
    padding: 2px 3px;
    height: 28px;
  }
  .d3 .tog span {
    border-radius: 999px;
    padding: 0 11px;
    height: 24px;
    line-height: 24px;
    color: #8e8e93;
  }
  .d3 .tog span.on {
    background: #404042;
    color: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.25);
  }
  .d3 .ghost { color: #aeaeb2; }
  .d3 .drop {
    background: #3a3a3c;
    border-color: rgba(94,201,145,.5);
  }
  .d3 .drop .ico { background: rgba(94,201,145,.14); color: #5ec991; }
  .d3 .drop h3 { color: #f5f5f7; }
  .d3 .prog { background: #3a3a3c; }
  .d3 .bar { background: rgba(255,255,255,.1); }
  .d3 .bar > i { background: #5ec991; width: 67%; }
  .d3 .sum .big { color: #5ec991; }
  .d3 .row { background: #3a3a3c; }
  .d3 .pill { background: rgba(94,201,145,.14); color: #5ec991; }
  .d3 .pill.busy { background: rgba(255,255,255,.08); color: #aeaeb2; }
  .d3 .reveal { background: rgba(255,255,255,.1); color: #aeaeb2; }
  .d3 .btn { background: #3a3a3c; color: #e5e5ea; }
  .d3 .btn.pri { background: #5ec991; color: #0f1a14; }

  /* ========== D4 Sage Mist ========== */
  .d4 { background: #2a322e; }
  .d4 .tb { background: #2a322e; border-bottom: 1px solid rgba(52,199,89,.12); }
  .d4 .body { background: #2a322e; }
  .d4 .tog { background: rgba(52,199,89,.1); }
  .d4 .tog span { color: rgba(180,220,190,.55); }
  .d4 .tog span.on {
    background: #354840;
    color: #5ace75;
    box-shadow: inset 0 0 0 1px rgba(52,199,89,.25);
  }
  .d4 .ghost { color: #8ab89a; }
  .d4 .drop {
    background: #343e38;
    border-color: rgba(90,206,117,.48);
  }
  .d4 .drop .ico {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: rgba(52,199,89,.12);
    color: #5ace75;
    border: 1px solid rgba(52,199,89,.25);
    font-size: 20px;
  }
  .d4 .drop.compact .ico { width: 30px; height: 30px; font-size: 13px; }
  .d4 .drop h3 { color: #e8f5ec; }
  .d4 .drop p { color: #8ab89a; }
  .d4 .prog { background: #343e38; border: 1px solid rgba(52,199,89,.12); }
  .d4 .bar { background: rgba(52,199,89,.15); }
  .d4 .bar > i { background: linear-gradient(90deg, #248a3d, #5ace75); width: 67%; }
  .d4 .sum .big { color: #5ace75; }
  .d4 .row { background: #343e38; border: 1px solid rgba(52,199,89,.1); }
  .d4 .pill { background: rgba(52,199,89,.14); color: #5ace75; }
  .d4 .pill.busy { background: rgba(52,199,89,.1); color: #7ad990; }
  .d4 .reveal { background: rgba(52,199,89,.12); color: #7ad990; }
  .d4 .btn { background: #343e38; color: #a8d4b5; border: 1px solid rgba(52,199,89,.15); }
  .d4 .btn.pri { background: #5ace75; color: #122018; border: 0; }

  /* ========== D5 Blue Mist ========== */
  .d5 { background: #2a303a; }
  .d5 .tb { background: #2a303a; border-bottom: 1px solid rgba(130,160,200,.12); }
  .d5 .body { background: #2a303a; }
  .d5 .tog { background: rgba(130,170,220,.12); }
  .d5 .tog span { color: rgba(170,190,220,.55); }
  .d5 .tog span.on {
    background: #3a4454;
    color: #b4c8e4;
    box-shadow: 0 1px 2px rgba(0,0,0,.25);
  }
  .d5 .ghost { color: #8aa0bc; }
  .d5 .drop {
    background: #343c4a;
    border-color: rgba(140,175,220,.48);
  }
  .d5 .drop::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(
        -18deg,
        transparent 0 14px,
        rgba(140,175,220,.035) 14px 15px
      );
    pointer-events: none;
  }
  .d5 .drop .ico {
    background: rgba(140,175,220,.14);
    color: #a8c4e8;
    position: relative;
  }
  .d5 .drop h3, .d5 .drop p, .d5 .drop .micro { position: relative; }
  .d5 .drop h3 { color: #eef2f8; }
  .d5 .drop p { color: #8aa0bc; }
  .d5 .prog { background: #343c4a; border: 1px solid rgba(140,175,220,.12); }
  .d5 .bar { background: rgba(255,255,255,.1); }
  .d5 .bar > i { background: linear-gradient(90deg, #6b8cbe, #a8c4e8); width: 67%; }
  .d5 .sum .big { color: #8fd4a8; }
  .d5 .row { background: #343c4a; border: 1px solid rgba(140,175,220,.1); }
  .d5 .pill { background: rgba(143,212,168,.14); color: #8fd4a8; }
  .d5 .pill.busy { background: rgba(140,175,220,.14); color: #a8c4e8; }
  .d5 .reveal { background: rgba(140,175,220,.12); color: #a8c4e8; }
  .d5 .btn { background: #343c4a; color: #b0c4de; border: 1px solid rgba(140,175,220,.14); }
  .d5 .btn.pri { background: #6b8cbe; color: #141820; border: 0; }

  .footer {
    position: sticky;
    bottom: 0;
    margin: 28px -24px -72px;
    padding: 14px 24px 22px;
    background: linear-gradient(180deg, transparent, rgba(24,20,18,.94) 28%);
    display: flex;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
  }
  .footer .pick { color: #fff; font-size: 13px; }
  .footer .pick span { font-weight: 700; color: #9ed4ff; }
  .footer button {
    appearance: none; border: 0; border-radius: 8px;
    padding: 8px 14px;
    font: 600 13px/1 -apple-system, sans-serif;
    background: #0a84ff; color: #fff; cursor: pointer;
  }
</style>
</head>
<body>
  <h1>EggplantTinyPNG — 深色主题候选</h1>
  <p class="intro">
    已按你的反馈改过：<strong>不要纯黑</strong>（全部提到中灰深色约 #2a–#32）、
    <strong>投放区统一虚线框</strong>、标题栏与内容同色、分段开关代替系统 Toggle。
    点选后告诉我代号即可落到 Swift。
  </p>

  <div class="grid">

    <!-- D1 -->
    <label class="card">
      <div class="card-head">
        <input type="radio" name="theme" value="D1" checked />
        <div class="card-meta">
          <h2>D1 · Soft Charcoal</h2>
          <p>中灰炭灰 #2c2c2e（非纯黑）+ 冰蓝虚线投放。干净工具感。</p>
        </div>
        <span class="badge rec">推荐</span>
      </div>
      <div class="stage">
        <div class="stage-col">
          <span class="stage-label">空态</span>
          <div class="win d1">
            <div class="tb">
              <div class="dots"><i class="r"></i><i class="y"></i><i class="g"></i></div>
              <div class="title">EggplantTinyPNG</div>
              <div class="act">
                <div class="tog"><span class="on">自动导出</span><span>手动</span></div>
                <span class="ghost">打开</span>
              </div>
            </div>
            <div class="body">
              <div class="drop hero">
                <div class="ico">⬇</div>
                <h3>拖放图片到此处</h3>
                <p>PNG · JPEG · WebP</p>
                <span class="micro">或点击选择文件</span>
              </div>
              <p class="hint">自动导出 · 原名-tiny-时间戳.ext</p>
            </div>
          </div>
        </div>
        <div class="stage-col">
          <span class="stage-label">有队列</span>
          <div class="win d1">
            <div class="tb">
              <div class="dots"><i class="r"></i><i class="y"></i><i class="g"></i></div>
              <div class="title">EggplantTinyPNG</div>
              <div class="act">
                <div class="tog"><span class="on">自动导出</span><span>手动</span></div>
                <span class="ghost">打开</span>
              </div>
            </div>
            <div class="body">
              <div class="drop compact">
                <div class="ico">⬇</div>
                <div><h3>继续添加</h3><p style="margin:0;font-size:11px;opacity:.5">拖放或点击</p></div>
              </div>
              <div class="prog">
                <div class="top"><span>压缩 2 / 3</span><span style="opacity:.5">67%</span></div>
                <div class="bar"><i></i></div>
              </div>
              <div class="sum">
                <div><div class="lab">已节省</div><div class="big">1.2 MB · 58%</div></div>
                <span class="n">3 张</span>
              </div>
              <div class="queue">
                <div class="row">
                  <div class="thumb"></div>
                  <div class="meta"><div class="name">hero-banner.png</div><div class="sub">→ hero-banner-tiny-20260815-204500.png</div></div>
                  <span class="pill">−63%</span>
                  <span class="reveal">↗</span>
                </div>
                <div class="row">
                  <div class="thumb b"></div>

const picked = document.getElementById("picked");
document.querySelectorAll('input[name="theme"]').forEach((r) => {
  r.addEventListener("change", () => { picked.textContent = r.value; });
});
document.getElementById("copy").addEventListener("click", async () => {
  const v = document.querySelector('input[name="theme"]:checked')?.value || "D1";
  const map = {
    D1: "D1 Soft Charcoal：中灰 #2c2c2e + 冰蓝虚线投放 + 分段自动/手动（推荐）",
    D2: "D2 Warm Slate：暖灰 #2e2c2a + 香槟金虚线投放",
    D3: "D3 Graphite Soft：稍亮石墨 #323234 + 薄荷绿虚线 + 胶囊 Toggle",
    D4: "D4 Sage Mist：鼠尾草绿灰 #2a322e + 翠绿虚线圆图标",
    D5: "D5 Blue Mist：雾蓝灰 #2a303a + 钢蓝虚线",
  };
  const text = `选 EggplantTinyPNG 深色主题：${map[v]}。非纯黑；投放区虚线框；标题栏与内容同色；不用系统 Switch。`;
  try {
    await navigator.clipboard.writeText(text);
    const btn = document.getElementById("copy");
    btn.textContent = "已复制";
    setTimeout(() => { btn.textContent = "复制选择说明"; }, 1200);
  } catch {
    prompt("复制这段发给我：", text);
  }
});
</script>
